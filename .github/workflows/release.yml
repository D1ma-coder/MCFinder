name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Rust toolchain
        run: rustup update stable --no-self-update
      - run: rustup target add ${{ matrix.target }}
      - run: cargo test --locked --no-default-features --target ${{ matrix.target }}
      - run: cargo build --release --locked --no-default-features --target ${{ matrix.target }}
      - run: python scripts/package.py --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish all tested builds together
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml","rb"))["package"]["version"])')
          tag="v$version"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo 'Tag and Cargo version differ'; exit 1
          fi
          cp docs/RELEASE_NOTES.md release-notes.md
          printf '\n### SHA-256\n\n```text\n' >> release-notes.md
          sha256sum release-assets/* | sed 's@release-assets/@@' >> release-notes.md
          printf '```\n' >> release-notes.md
          gh release create "$tag" release-assets/* --target "$GITHUB_SHA" --title "MCFinder $tag — scriptable seed search engine" --notes-file release-notes.md --latest
