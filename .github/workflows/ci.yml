name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Rust toolchain
        run: rustup update stable --no-self-update
      - run: cargo fmt --all --check
      - run: cargo test --locked --no-default-features
      - run: cargo clippy --locked --no-default-features --all-targets -- -D warnings
      - name: Terminal integration
        if: runner.os != 'Windows'
        run: python3 tests/tui_smoke.py target/debug/mcfinder
